<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font: message-box;
      padding: 0.5em 1em;
    }
    fieldset {
      margin-block: 0.75em;
    }
    label {
      display: grid;
      grid-template-columns: 12em 10em;
      align-items: center;
      margin-block: 0.4em;
    }
  </style>
</head>
<body>
  <section id="prefs">
    <label>
      <span data-i18n="optMaxTokens"></span>
      <input type="number" id="maxTokens">
    </label>
    <label>
      <span data-i18n="optJunkThreshold"></span>
      <input type="number" id="threshold">
    </label>
  </section>
  <fieldset id="uncertain">
    <legend data-i18n="optUncertainFolders"></legend>
    <button type="button" id="add" data-i18n="optAdd"></button>
    <button type="button" id="remove" data-i18n="optRemove"></button>
  </fieldset>
  <script src="options.js"></script>
</body>
</html>
